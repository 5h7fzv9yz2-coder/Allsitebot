name: Pokemon Stock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: 'Clear history and resend all links?'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: write

concurrency:
  group: pokemon-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Pokemon stock monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.reset }}" = "yes" ]; then
            echo "MANUAL RESET - clearing history"
            rm -f last_products.json seen_products.json
            python -u pokemon_monitor.py --reset
          else
            python -u pokemon_monitor.py
          fi

      - name: Save product history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "Update Pokemon product history [${{ github.event_name }}]"
            git push
          fi
